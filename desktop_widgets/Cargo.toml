[package]
name = "meowterialyou-widgets"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_10"] }
gdk4-x11 = "0.9"
gtk4-layer-shell = "0.4"
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
zbus = "4.0"
tokio = { version = "1.0", features = ["full"] }
once_cell = "1.19"
anyhow = "1.0"
glib = "0.21.5"
gio = "0.21.5"
async-channel = "2.5.0"
urlencoding = "2.1.3"
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls"] }
bytes = "1.0"
lazy_static = "1.5.0"
serde_json = "1.0"
futures-util = "0.3"
chrono = "0.4"
notify = "6.1"
dirs = "6.0"

[[bin]]
name = "media_widget"
path = "src/bin/media_widget.rs"

[[bin]]
name = "manager"
path = "src/bin/manager.rs"
[[bin]]
name = "weather_widget"
path = "src/bin/weather_widget.rs"
