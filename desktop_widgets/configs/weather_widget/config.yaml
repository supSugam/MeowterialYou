layout:
  position: bottom_left
  width: 360
  gap: [24, 48]
  alignment: auto
  scale: 1.0
  padding: 20
  corner_radius: 8
  border_width: 2

emoji:
  value: "😼"
  scale: 0.5
  rotate: 20
  row: 2

typography:
  font_family: "Inter"
  icon_font: "MesloLGS Nerd Font Mono"
  time_size: 60

background:
  style: "smart_transparency"
  opacity: 80

weather:
  unit: 'C'
  wind_unit: "km"
  refresh_interval_min: 10

clock:
  format: "12h"
  show_ampm: true

visibility:
  show_weather: true
  show_computer_metrics: true
  show_divider: true

performance:
  dynamic_refresh: true
  refresh_normal_ms: 2000
  refresh_eco_ms: 10000
