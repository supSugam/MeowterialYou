[GTK4]
template_path = ./example/templates/gtk.css
output_path = ~/.config/gtk-4.0/gtk.css

[GTK4-DARK]
template_path = ./example/templates/gtk_dark.css
output_path = ~/.config/gtk-4.0/gtk.css


[SHELL]
template_path = ./example/templates/gnome-shell.css
output_path = ~/.themes/MeowterialYou-light/gnome-shell/gnome-shell.css

[SHELL-DARK]
template_path = ./example/templates/gnome-shell-dark.css
output_path = ~/.themes/MeowterialYou-dark/gnome-shell/gnome-shell.css

[GTK3]
template_path = ./example/templates/gtk_3_light.css
output_path = ~/.local/share/themes/MeowterialYou-light/gtk-3.0/gtk.css

[GTK3-DARK]
template_path = ./example/templates/gtk_3_dark.css
output_path = ~/.local/share/themes/MeowterialYou-dark/gtk-3.0/gtk.css

[GTK3-CONFIG-DARK]
template_path = ./example/templates/gtk_3_dark.css
output_path = ~/.config/gtk-3.0/gtk-dark.css

# In light mode, also update gtk-dark.css in case gtk.css is symlinked to it
# from a previous dark mode run. This ensures rubberband/selection colors are current.
[GTK3-CONFIG-LIGHT]
template_path = ./example/templates/gtk_3_light.css
output_path = ~/.config/gtk-3.0/gtk-dark.css

[VSCODE]
template_path = ./example/templates/Light.css
output_path= ~/.config/vscode-custom-css/Light.css

[VSCODE-DARK]
template_path = ./example/templates/Dark.css
output_path= ~/.config/vscode-custom-css/Dark.css

# Native VSCode Theme Extension
# Both sections point to same template/output so package.json is generated in both modes
[VSCODE-THEME-PACKAGE]
template_path = ./example/templates/vscode-theme/package.json
output_path = ~/.vscode/extensions/meowterialyou-theme/package.json

[VSCODE-THEME-PACKAGE-DARK]
template_path = ./example/templates/vscode-theme/package.json
output_path = ~/.vscode/extensions/meowterialyou-theme/package.json

[VSCODE-THEME]
template_path = ./example/templates/vscode-theme/themes/meowterialyou-light-color-theme.json
output_path = ~/.vscode/extensions/meowterialyou-theme/themes/meowterialyou-light-color-theme.json

[VSCODE-THEME-DARK]
template_path = ./example/templates/vscode-theme/themes/meowterialyou-dark-color-theme.json
output_path = ~/.vscode/extensions/meowterialyou-theme/themes/meowterialyou-dark-color-theme.json


[DISCORD-LIGHT]
template_path = ./example/templates/MaterialYouColors.theme.css
output_path = ~/.config/BetterDiscord/themes/MaterialYouColors.theme.css

[DISCORD-DARK]
template_path = ./example/templates/MaterialYouColors.theme.css
output_path = ~/.config/BetterDiscord/themes/MaterialYouColors.theme.css

[VIVALDI]
template_path = ./example/templates/vivaldi.css
output_path= ~/.config/vivaldi_css/trial.css

[VIVALDI-DARK]
template_path = ./example/templates/vivaldi.css
output_path= ~/.config/vivaldi_css/trial.css

[SPOTIFY]
template_path = ./example/templates/color.ini
output_path = ~/.config/spicetify/Themes/Matte/color.ini


[SPOTIFY-DARK]
template_path = ./example/templates/color.ini
output_path = ~/.config/spicetify/Themes/Matte/color.ini

[SHELL-TOGGLE-ON]
template_path = ./example/templates/toggle-on.svg
output_path = ~/.themes/MeowterialYou-light/gnome-shell/toggle-on.svg

[SHELL-TOGGLE-ON-DARK]
template_path = ./example/templates/toggle-on.svg
output_path = ~/.themes/MeowterialYou-dark/gnome-shell/toggle-on.svg