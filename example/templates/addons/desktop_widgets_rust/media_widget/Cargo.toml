[package]
name = "media_widget"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_10"] }
gtk4-layer-shell = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
zbus = "4.0"
tokio = { version = "1.0", features = ["full"] }
once_cell = "1.19"
anyhow = "1.0"
glib = "0.21.5"
async-channel = "2.5.0"
urlencoding = "2.1.3"
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
bytes = "1.0"
lazy_static = "1.5.0"
