--[[
MeowterialYou Desktop Widget - Light Mode
Auto-sizing with structured weather layout
]]

conky.config = {
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    alignment = '@{WIDGET_POSITION}',
    gap_x = @{WIDGET_GAP_X},
    gap_y = @{WIDGET_GAP_Y},
    
    minimum_width = 260,
    minimum_height = 0,
    
    border_width = 0,
    draw_borders = false,
    draw_outline = false,
    draw_shades = false,
    
    use_xft = true,
    font = '@{FONT_FAMILY}:size=12',
    xftalpha = 1,
    override_utf8_locale = true,
    
    default_color = '@{TEXT_COLOR}',
    
    background = true,
    double_buffer = true,
    update_interval = @{UPDATE_INTERVAL},
    
    border_inner_margin = @{PADDING},
    border_outer_margin = 0,
    
    lua_load = '@{LUA_SCRIPT_PATH}',
    lua_draw_hook_pre = 'draw_background',
};

conky.text = [[
${font @{FONT_FAMILY}:size=11}${time %a, %b %d}${font}
${voffset 2}${font @{FONT_FAMILY}:bold:size=@{TIME_FONT_SIZE}}${time @{TIME_FORMAT}}${font @{FONT_FAMILY}:size=16} @{AMPM_DISPLAY}${font}
${voffset 14}${font @{ICON_FONT}:size=22}${execi @{WEATHER_INTERVAL} sed -n '6p' ~/.cache/meowterialyou_weather 2>/dev/null || echo ''}${font}  ${font @{FONT_FAMILY}:bold:size=18}${execi @{WEATHER_INTERVAL} sed -n '1p' ~/.cache/meowterialyou_weather 2>/dev/null || echo '--'}${font}${alignr}${font @{FONT_FAMILY}:size=12}${execi @{WEATHER_INTERVAL} sed -n '2p' ~/.cache/meowterialyou_weather 2>/dev/null || echo 'Unknown'}${font}
${alignr}${font @{FONT_FAMILY}:size=11}${execi @{WEATHER_INTERVAL} sed -n '3p' ~/.cache/meowterialyou_weather 2>/dev/null || echo 'Unknown'}${font}
${voffset 8}${font @{ICON_FONT}:size=12}${font} ${execi @{WEATHER_INTERVAL} sed -n '4p' ~/.cache/meowterialyou_weather 2>/dev/null || echo '--'}${alignr}${font @{ICON_FONT}:size=12}${font} ${execi @{WEATHER_INTERVAL} sed -n '5p' ~/.cache/meowterialyou_weather 2>/dev/null || echo '--'}%
]];
