# ═══════════════════════════════════════════════════════════════════════════
#  MeowterialYou Desktop Widget Configuration
# ═══════════════════════════════════════════════════════════════════════════
#  Edit this file and run 'meowterialyou --reapply' to apply changes.
#  All values are case-sensitive unless noted otherwise.
# ═══════════════════════════════════════════════════════════════════════════


# ─────────────────────────────────────────────────────────────────
# Position & Layout
# ─────────────────────────────────────────────────────────────────

# Widget position on screen
# Options: bottom_left, bottom_right, top_left, top_right
POSITION="bottom_left"

# Offset from corner (pixels)
# 0,0 = exact corner positioning
GAP_X=24
GAP_Y=80

# Widget dimensions (pixels)
WIDTH=320
HEIGHT=200


# ─────────────────────────────────────────────────────────────────
# Background Style
# ─────────────────────────────────────────────────────────────────

# Background mode
# Options:
#   solid       - Colored background with transparency (Material You tinted glass)
#   transparent - No background, text directly on wallpaper (use high contrast colors)
BACKGROUND_MODE="solid"

# Background opacity (only applies when BACKGROUND_MODE="solid")
# Range: 0-100 (percentage)
#   0   = fully transparent (same as BACKGROUND_MODE="transparent")
#   50  = half transparent (glass effect)
#   100 = fully opaque (solid color)
BACKGROUND_OPACITY=55

# Corner radius
# NOTE: Conky does not support rounded corners natively.
# For rounded corners, use your compositor settings:
#   - Picom (X11): Add 'corner-radius = 16;' to picom.conf
#   - GNOME (Wayland): Rounded corners not supported for Conky windows
# This setting is kept for future compatibility but currently has no effect.
CORNER_RADIUS=16


# ─────────────────────────────────────────────────────────────────
# Time Display
# ─────────────────────────────────────────────────────────────────

# Time format
# Options: 12h, 24h
TIME_FORMAT="12h"

# Show AM/PM indicator (only applies when TIME_FORMAT="12h")
# Options: true, false
SHOW_AMPM="true"


# ─────────────────────────────────────────────────────────────────
# Weather
# ─────────────────────────────────────────────────────────────────

# Temperature unit
# Options: C (Celsius), F (Fahrenheit)
TEMP_UNIT="C"

# Weather API key (optional)
# Leave empty to use wttr.in (free, no API key needed)
# For OpenWeatherMap: get key from https://openweathermap.org/api
WEATHER_API_KEY=""


# ─────────────────────────────────────────────────────────────────
# Font
# ─────────────────────────────────────────────────────────────────

# Primary font family (must be installed on system)
# Recommended: Inter, Roboto, Outfit, SF Pro Display
FONT_FAMILY="Inter"

# Time font size (pixels)
TIME_FONT_SIZE=56

# Date font size (pixels)
DATE_FONT_SIZE=16

# Weather font size (pixels)
WEATHER_FONT_SIZE=14


# ─────────────────────────────────────────────────────────────────
# Advanced
# ─────────────────────────────────────────────────────────────────

# Update interval for clock (seconds)
# Lower = smoother but uses more CPU
UPDATE_INTERVAL=1

# Weather refresh interval (seconds)
# Recommended: 900 (15 minutes) or higher to avoid rate limits
WEATHER_INTERVAL=900

# Internal padding (pixels) - space between text and widget edge
PADDING=24
