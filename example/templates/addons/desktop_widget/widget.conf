# ═══════════════════════════════════════════════════════════════════════════
#  MeowterialYou Desktop Widget Configuration
# ═══════════════════════════════════════════════════════════════════════════
#  Edit this file and run 'meowterialyou --reapply' to apply changes.
#  All values are case-sensitive unless noted otherwise.
# ═══════════════════════════════════════════════════════════════════════════


# ─────────────────────────────────────────────────────────────────
# Position & Layout
# ─────────────────────────────────────────────────────────────────

# Widget position on screen
# Options: bottom_left, bottom_right, top_left, top_right
POSITION="bottom_left"

# Offset from corner (pixels)
# 0 = exact corner, values are exact pixel distances
GAP_X=24
GAP_Y=24

# Inner padding (pixels) - same on all sides
PADDING=20


# ─────────────────────────────────────────────────────────────────
# Background Style
# ─────────────────────────────────────────────────────────────────

# Background mode
# Options:
#   solid       - Colored background with transparency
#   transparent - No background, text on wallpaper
BACKGROUND_MODE="solid"

# Background opacity (0-100)
#   0  = fully transparent
#   50 = glass effect (recommended)
BACKGROUND_OPACITY=50

# Corner radius (pixels)
CORNER_RADIUS=24


# ─────────────────────────────────────────────────────────────────
# Time Display
# ─────────────────────────────────────────────────────────────────

# Time format
# Options: 12h, 24h
TIME_FORMAT="12h"

# Show AM/PM (only applies to 12h format)
SHOW_AMPM="true"


# ─────────────────────────────────────────────────────────────────
# Typography
# ─────────────────────────────────────────────────────────────────

# Font family for text
FONT_FAMILY="Inter"

# Icon font (Nerd Font recommended for weather icons)
ICON_FONT="MesloLGS Nerd Font Mono"

# Font sizes
TIME_FONT_SIZE=48
DATE_FONT_SIZE=14
WEATHER_FONT_SIZE=13


# ─────────────────────────────────────────────────────────────────
# Advanced
# ─────────────────────────────────────────────────────────────────

# Update intervals (seconds)
UPDATE_INTERVAL=1
WEATHER_INTERVAL=900
