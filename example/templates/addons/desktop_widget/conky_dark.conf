--[[
MeowterialYou Desktop Widget - Dark Mode
=========================================
A Material You themed Conky widget displaying clock and weather.
Colors are automatically applied from your current theme.

Template placeholders:
- @{primary.hex} - Primary accent color
- @{onSurface.hex} - Text color
- @{surface.hex} - Background color
- @{surfaceContainer.hex} - Card background
- @{outline.hex} - Subtle text/dividers
]]

conky.config = {
    -- Window settings
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 200,
    own_window_colour = '@{surfaceContainer.hex}',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    -- Position & Size
    alignment = 'bottom_right',
    gap_x = 40,
    gap_y = 40,
    minimum_width = 280,
    minimum_height = 180,
    maximum_width = 280,
    
    -- Appearance
    border_width = 0,
    draw_borders = false,
    draw_outline = false,
    draw_shades = false,
    draw_graph_borders = false,
    
    -- Fonts & Colors
    use_xft = true,
    font = 'Inter:size=11',
    xftalpha = 1,
    default_color = '@{onSurface.hex}',
    color1 = '@{primary.hex}',
    color2 = '@{outline.hex}',
    color3 = '@{onSurface.hex}',
    
    -- Behavior
    background = true,
    cpu_avg_samples = 2,
    double_buffer = true,
    no_buffers = true,
    update_interval = 1,
    uppercase = false,
    use_spacer = 'none',
    
    -- Rounded corners (requires Cairo/Lua, fallback to none)
    border_outer_margin = 16,
    border_inner_margin = 16,
};

conky.text = [[
${voffset 8}${font Inter:bold:size=48}${color1}${time %H:%M}${font}${color}
${voffset -4}${font Inter:size=14}${color2}${time %A, %B %d}${font}${color}
${voffset 16}${hr 1}
${voffset 8}${font Inter:size=12}${color3}${execi 1800 ~/.config/conky/meowterialyou_weather.sh}${font}${color}
]];
