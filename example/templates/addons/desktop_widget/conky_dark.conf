--[[
MeowterialYou Desktop Widget - Dark Mode
=========================================
A Material You themed Conky widget displaying clock and weather.
Configuration is read from widget.conf in this directory.
]]

conky.config = {
    -- Window settings (works on both X11 and Wayland)
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_transparent = @{TRANSPARENT_MODE},
    own_window_argb_visual = true,
    own_window_argb_value = @{ARGB_VALUE},
    own_window_colour = '@{BACKGROUND_COLOR}',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    -- Position & Size
    alignment = '@{WIDGET_POSITION}',
    gap_x = @{WIDGET_GAP_X},
    gap_y = @{WIDGET_GAP_Y},
    minimum_width = @{WIDGET_WIDTH},
    minimum_height = @{WIDGET_HEIGHT},
    maximum_width = @{WIDGET_WIDTH},
    
    -- Appearance
    border_width = 0,
    draw_borders = false,
    draw_outline = false,
    draw_shades = false,
    draw_graph_borders = false,
    
    -- Fonts & Colors  
    use_xft = true,
    font = '@{FONT_FAMILY}:size=12',
    xftalpha = 1,
    default_color = '@{TEXT_COLOR}',
    color1 = '@{ACCENT_COLOR}',
    color2 = '@{SECONDARY_COLOR}',
    color3 = '@{TEXT_COLOR}',
    
    -- Behavior
    background = true,
    cpu_avg_samples = 2,
    double_buffer = true,
    no_buffers = true,
    update_interval = @{UPDATE_INTERVAL},
    uppercase = false,
    use_spacer = 'none',
    
    -- No margins so gap values are exact (padding is done in text template)
    border_outer_margin = 0,
    border_inner_margin = 0,
};

conky.text = [[
${voffset @{PADDING}}${offset @{PADDING}}${font @{FONT_FAMILY}:bold:size=@{TIME_FONT_SIZE}}${color1}${time @{TIME_FORMAT}}${font @{FONT_FAMILY}:light:size=20} @{AMPM_DISPLAY}${font}${color}
${voffset 6}${offset @{PADDING}}${font @{FONT_FAMILY}:size=@{DATE_FONT_SIZE}}${color2}${time %A, %B %d}${font}${color}
${voffset 16}${offset @{PADDING}}${color2}${hr 1}${color}
${voffset 12}${offset @{PADDING}}${font @{FONT_FAMILY}:size=@{WEATHER_FONT_SIZE}}${color3}${execi @{WEATHER_INTERVAL} ~/.config/conky/meowterialyou_weather.sh}${font}${color}
${voffset @{PADDING}}]];
