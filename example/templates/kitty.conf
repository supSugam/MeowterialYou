# Kitty Material You Theme
# Generated by MeowterialYou

font_family           @{system_monospace_font}
font_size             @{system_monospace_font_size}

cursor                @{primary.hex}
cursor_text_color     @{onPrimary.hex}

foreground            @{onSurface.hex}
background            @{surface.hex}
selection_foreground  @{onPrimaryContainer.hex}
selection_background  @{primaryContainer.hex}
url_color             @{tertiary.hex}

# Display Server
linux_display_server auto

# Window Decorations & Layout
hide_window_decorations no
window_padding_width 12
window_margin_width 0
confirm_os_window_close 0

# Tab Bar (Acts as a minimal header, matching GTK-style headerbar)
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{title}"

active_tab_foreground   @{onPrimary.hex}
active_tab_background   @{primary.hex}
active_tab_font_style   bold
inactive_tab_foreground @{onSurfaceVariant.hex}
inactive_tab_background @{surfaceContainer.hex}
inactive_tab_font_style normal
tab_bar_background      @{surfaceContainer.hex}

# Headerbar / Titlebar (Matching GTK surfaceContainer)
wayland_titlebar_color  @{surfaceContainer.hex}

# Transparency
background_opacity    @{opacity}
dynamic_background_opacity yes

# 16-color ANSI Palette

# black
color0  @{term_black}
# red
color1  @{term_red}
# green
color2  @{term_green}
# yellow
color3  @{term_yellow}
# blue
color4  @{term_blue}
# magenta
color5  @{term_magenta}
# cyan
color6  @{term_cyan}
# white
color7  @{term_white}

# bright colors
# bright black
color8  @{term_bright_black}
# bright red
color9  @{term_bright_red}
# bright green
color10 @{term_bright_green}
# bright yellow
color11 @{term_bright_yellow}
# bright blue
color12 @{term_bright_blue}
# bright magenta
color13 @{term_bright_magenta}
# bright cyan
color14 @{term_bright_cyan}
# bright white
color15 @{term_bright_white}
